/* ============ events ============ */
document.addEventListener("click", async e => {
  const b = e.target.closest("button, .shot, .dlshot");
  if (!b) return;
  const D = b.dataset;

  if (D.tab) return go(D.tab);
  if (D.viewshot) {
    const src = shotURL(D.viewshot);
    if (!src) return;
    const o = document.createElement("div");
    o.className = "ovl lightbox";
    o.innerHTML = `<img src="${src}" alt="">`;
    o.addEventListener("click", () => o.remove());
    document.body.appendChild(o);
    return;
  }
  if (D.mon) {
    const b = new Date((S.cal || today().slice(0, 7)) + "-01T12:00:00");
    b.setMonth(b.getMonth() + (+D.mon));
    S.cal = `${b.getFullYear()}-${String(b.getMonth() + 1).padStart(2, "0")}`;
    S.dayView = null;
    return render();
  }
  if (D.cal) { S.dayView = D.cal; window.scrollTo(0, 0); return render(); }
  if ("daylogBack" in D) { S.dayView = null; window.scrollTo(0, 0); return render(); }
  if (D.dltoggle) { S.dlOpen[D.dltoggle] = !S.dlOpen[D.dltoggle]; return render(); }
  if ("coach" in D) {
    busy.coach = true; render();
    try {
      const L = closed(live());
      S.coach = { text: await writtenRead(), at: Date.now(), n: L.length };
      await DB.set("coach", S.coach);
    } catch (err) { alert(err.message); }
    busy.coach = false; return render();
  }
  if ("x" in D) return closeSheet();

  /* day type */
  if (D.daytype) {
    if (draft && draft.mode === "backtest") {
      draft.dayType = draft.dayType === D.daytype ? null : D.daytype;
      editSec = null;
      return renderSheet();
    }
    const d = draft ? draft.date : today();
    /* trades already logged keep the day type that was current when they were logged */
    S.days[d] = S.days[d] === D.daytype ? null : D.daytype;
    editSec = null;
    await save(); return render();
  }

  /* new / close */
  if (D.new) { draft = newDraft(D.new); draft.dayType = S.days[today()] || null; sheet = "entry"; editSec = null; return render(); }
  if (D.open) {
    const found = S.trades.find(t => t.id === D.open);
    if (!found) return;
    draft = JSON.parse(JSON.stringify(found));
    editMode = true;
    await loadShots([draft]);
    sheet = "entry";
    return render();
  }

  /* draft edits */
  if (draft) {
    if (D.setup) { draft.setup = +D.setup; draft.gates = {}; draft.seq = null; editSec = null; return renderSheet(); }
    if (D.seq) {
      draft.seq = D.seq;
      /* both answers start from "everything was there" so the only taps needed are the exceptions */
      draft.gates = {};
      gatesOf(draft).forEach(g => draft.gates[g.k] = true);
      editSec = null;
      return renderSheet();
    }
    if (D.dir) { draft.dir = D.dir; editSec = null; return renderSheet(); }
    if (D.gate) { draft.gates[D.gate] = !draft.gates[D.gate]; return renderSheet(); }
    if (D.size) { draft.size = Math.max(1, Math.min(99, n(draft.size) + +D.size)); return renderSheet(); }
    if (D.outcome) {
      draft.outcome = D.outcome;
      if (D.outcome !== "manual") draft.manualReason = null;
      if (D.outcome === "target") draft.exitPrice = draft.target;
      else if (D.outcome === "stop") draft.exitPrice = draft.stop;
      else if (D.outcome === "be") draft.exitPrice = draft.entry;
      return renderSheet();
    }
    if (D.reason) { draft.manualReason = draft.manualReason === D.reason ? null : D.reason; return renderSheet(); }
    if (D.rmshot != null) {
      e.stopPropagation();
      if (!Array.isArray(draft.shots)) draft.shots = shotKeys(draft);
      const [k] = draft.shots.splice(+D.rmshot, 1);
      if (k && !String(k).startsWith("data:")) { delete IMG[k]; await DB.del("img:" + k); }
      await save();
      return renderSheet();
    }
    if ("addshot" in D) {
      const el = $("#picker");
      el.value = "";
      el.onchange = () => { if (el.files.length) addShots(el.files); };
      el.click();
      return;
    }
    if ("savedraft" in D) {
      draft.dayType = draft.mode === "live" ? (S.days[draft.date] || null) : null;
      draft.closed = true;
      if (editMode) {
        const i = S.trades.findIndex(t => t.id === draft.id);
        if (i > -1) S.trades[i] = draft; else S.trades.push(draft);
      } else {
        draft.closedAt = Date.now();
        S.trades.push(draft);
      }
      await save(); closeSheet(); return render();
    }
  }

  /* detail actions */
  if (D.del) {
    if (!confirm("Eliminare questo trade?")) return;
    await dropShots(S.trades.find(t => t.id === D.del));
    S.trades = S.trades.filter(t => t.id !== D.del);
    await save(); closeSheet(); return render();
  }
  if (D.vision) {
    if (!draft?.shots?.entrata) return alert("Serve lo screenshot dell'entrata.");
    busy.vision = true; renderSheet();
    try {
      draft.vision = await analyseEntry(draft);
      const i = S.trades.findIndex(x => x.id === draft.id);
      if (i > -1) { S.trades[i].vision = draft.vision; await save(); }
    } catch (err) { alert(err.message); }
    busy.vision = false; renderSheet(); return;
  }

  /* claude reads */
  if ("cmpread" in D) {
    busy.cmp = true; render();
    try { S.cmpOut = await compareRead(); } catch (err) { alert(err.message); }
    busy.cmp = false; return render();
  }

  /* data */
  if ("diag" in D) {
    busy.diag = true; S.diag = null; render();
    const L = [];
    const key = "diag:" + uid();
    const step = async (label, fn) => {
      const t0 = performance.now();
      try { const r = await fn(); L.push(`OK   ${label}  (${Math.round(performance.now() - t0)}ms)${r ? " " + r : ""}`); return true; }
      catch (e) { L.push(`FAIL ${label}\n     ${[e?.code, e?.message, e?.details, e?.hint].filter(Boolean).join(" · ")}`); return false; }
    };
    /* a tiny row proves the table is reachable and writable at all */
    let ok = await step("scrittura riga piccola", () => DB.probe(key, { hello: 1 }));
    if (ok) await step("rilettura riga piccola", async () => {
      const v = await DB.probe(key);
      if (!v || v.hello !== 1) throw new Error("riletta ma vuota o diversa");
    });
    /* then one the size of a real screenshot, which is what actually fails */
    const big = "data:image/jpeg;base64," + "A".repeat(320000);
    const okBig = await step(`scrittura riga grande (${Math.round(big.length / 1024)} KB)`, () => DB.probe(key + ":big", big));
    if (okBig) await step("rilettura riga grande", async () => {
      const v = await DB.probe(key + ":big");
      if (typeof v !== "string") throw new Error("riletta ma non è una stringa");
      if (v.length !== big.length) throw new Error(`troncata: scritti ${big.length}, riletti ${v.length}`);
      return `${Math.round(v.length / 1024)} KB integri`;
    });
    /* and finally whether the images this journal already references exist */
    const keys = S.trades.flatMap(shotKeys).filter(k => k && !String(k).startsWith("data:"));
    if (keys.length) {
      let found = 0;
      for (const k of keys.slice(0, 40)) { try { if (await DB.probe("img:" + k)) found++; } catch (_) { } }
      const n = Math.min(keys.length, 40);
      L.push(`${found === n ? "OK  " : "FAIL"} immagini presenti nel database: ${found} su ${n} controllate`);
    } else L.push("--   nessuna immagine referenziata dai trade");

    await DB.probeDel(key); await DB.probeDel(key + ":big");
    S.diag = L.join("\n");
    busy.diag = false; return render();
  }
  if ("export" in D) {
    const imgs = {};
    for (const t of S.trades)
      for (const k of shotKeys(t))
        if (!String(k).startsWith("data:")) imgs[k] = IMG[k] !== undefined ? IMG[k] : await DB.get("img:" + k);
    const blob = new Blob([JSON.stringify({ v: 3, cfg: S.cfg, trades: S.trades, days: S.days, va: S.va, coach: S.coach, imgs }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `alban-trading-journal-${today()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    return;
  }
  if ("import" in D) {
    const el = $("#filepicker"); el.value = "";
    el.onchange = () => {
      const f = el.files[0]; if (!f) return;
      const fr = new FileReader();
      fr.onload = async () => {
        try {
          const j = JSON.parse(fr.result);
          if (!Array.isArray(j.trades)) throw 0;
          S.cfg = { ...DEFAULT_CFG, ...(j.cfg || {}) };
          S.trades = j.trades; S.days = j.days || {}; S.va = j.va || {};
          IMGMISS.clear();
          for (const [k, v] of Object.entries(j.imgs || {})) { IMG[k] = v; await DB.set("img:" + k, v); }
          if (j.coach) { S.coach = j.coach; await DB.set("coach", S.coach); }
          await save(); alert("Backup ripristinato."); render();
        } catch (_) { alert("Il file non è leggibile."); }
      };
      fr.readAsText(f);
    };
    el.click(); return;
  }
  if ("wipe" in D) {
    if (!confirm("Cancellare tutti i trade? Non si torna indietro.")) return;
    for (const t of S.trades) await dropShots(t);
    S.trades = []; S.days = {}; S.va = {}; IMGMISS.clear(); await save(); return render();
  }
});

/* levels: redraw on blur so the panel updates without disturbing typing */
document.addEventListener("change", ev => { if (ev.target.dataset && ev.target.dataset.va) render(); });

/* the RTH countdown and the cooldown are time-based, so they have to tick */
let _lastTick = "";
setInterval(() => {
  if (S.tab !== "dashboard" || sheet) return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  const now = nowHM() + "|" + (cooldown() || "");
  if (now === _lastTick) return;
  _lastTick = now;
  render();
}, 20000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.tab === "dashboard" && !sheet) render();
});

/* drawer */
document.getElementById("burger").addEventListener("click", () => document.body.classList.toggle("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));

/* drag-and-drop and paste straight onto the screenshot grid */
const dzOf = e => (e.target.closest ? e.target.closest(".shots.dz") : null);
document.addEventListener("dragenter", e => { if (draft && dzOf(e)) e.preventDefault(); });
document.addEventListener("dragover", e => {
  const dz = draft && dzOf(e);
  if (!dz) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
  dz.classList.add("over");
});
document.addEventListener("dragleave", e => {
  const dz = dzOf(e);
  if (dz && !dz.contains(e.relatedTarget)) dz.classList.remove("over");
});
document.addEventListener("drop", e => {
  const dz = draft && dzOf(e);
  if (!dz) return;
  e.preventDefault();
  dz.classList.remove("over");
  const f = e.dataTransfer?.files;
  if (f && f.length) addShots(f);
});
/* dropping anywhere else must not make the browser navigate away from the journal */
document.addEventListener("dragover", e => { if (!dzOf(e)) e.preventDefault(); });
document.addEventListener("drop", e => { if (!dzOf(e)) e.preventDefault(); });

document.addEventListener("paste", e => {
  if (!draft || !sheet) return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  const files = [...(e.clipboardData?.items || [])]
    .filter(i => i.kind === "file" && i.type.startsWith("image/"))
    .map(i => i.getAsFile())
    .filter(Boolean);
  if (files.length) { e.preventDefault(); addShots(files); }
});

/* inputs */
document.addEventListener("blur", e => {
  const id = e.target?.dataset?.daynote;
  if (!id) return;
  const t = S.trades.find(x => x.id === id);
  if (!t) return;
  if (t.note !== e.target.value) { t.note = e.target.value; save(); }
}, true);

/* refresh every derived panel in the sheet without re-rendering the inputs the user is typing into */
function refreshDraftDerived() {
  if (!draft) return;
  const st = $(".sheet");
  if (!st) return;
  const calc = st.querySelector(".calc");
  if (calc) calc.outerHTML = calcStrip(draft);
  const rf = st.querySelector("[data-rth]");
  if (rf) rf.innerHTML = rthFlag(draft);
  const kf = st.querySelector("[data-risk]");
  if (kf) kf.innerHTML = riskFlag(draft);
  const btn = st.querySelector("[data-savedraft]");
  if (btn) {
    const ds = draftState(draft);
    btn.disabled = !ds.ready;
    btn.textContent = ds.label;
  }
}

document.addEventListener("input", e => {
  const D = e.target.dataset;
  if (D.f && draft) {
    draft[D.f] = e.target.value;
    refreshDraftDerived();
  }

  if (D.c) {
    const v = e.target.type === "checkbox" ? e.target.checked
      : ["maxTrades", "riskPct", "dailyLossR", "minRR1", "minRR2", "pointValue", "accountSize", "cooldownMin"].includes(D.c) ? n(e.target.value)
        : e.target.value;
    S.cfg[D.c] = v; queueSave();
  }
});

/* ============ init ============ */
(async () => {
  const st = await DB.get("state");
  if (st) {
    S.cfg = { ...DEFAULT_CFG, ...(st.cfg || {}) };
    S.trades = st.trades || [];
    S.days = st.days || {};
    S.va = st.va || {};
  }
  const meta = await DB.get("state_meta");
  stateRev = (meta && meta.rev) || 0;
  S.coach = (await DB.get("coach")) || null;
  S.stg = await storageInfo();
  render();
  maybeCoach();
})();

/* regenerate the written read on its own, but only when there is enough new material */
async function maybeCoach() {
  if (busy.coach || !S.cfg.apiKey) return;
  const L = closed(live());
  if (L.length < 5) return;
  if (S.coach && L.length - S.coach.n < 3) return;
  busy.coach = true; render();
  try {
    S.coach = { text: await writtenRead(), at: Date.now(), n: L.length };
    await DB.set("coach", S.coach);
  } catch (_) { }
  busy.coach = false; render();
}

</script>
