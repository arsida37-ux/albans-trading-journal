<style>
:root{
  --bg:#08090D; --side:#0C0E14; --surf:#12141C; --surf2:#181B26; --surf3:#212536;
  --line:#1E2029; --line2:#2A2D3C;
  --txt:#F3F5FA; --dim:#8891A3; --dim2:#5D6579;
  --acc:#4A63F0; --acc-hi:#7D91FF; --acc-d:#10152F; --acc-b:#2C3B8F; --acc-gl:rgba(74,99,240,.16);
  --grn:#2ECC81; --grn-d:#0D2A1D; --grn-b:#1B5237;
  --red:#F2555C; --red-d:#2C1318; --red-b:#5C2129;
  --amb:#E4A82E; --amb-d:#2A2210; --amb-b:#55461A;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ui:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sw:242px;
  --r:12px;
  --sh-sm:0 1px 2px rgba(0,0,0,.35);
  --sh-md:0 10px 30px -12px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.03) inset;
  --sh-lg:0 24px 70px -24px rgba(0,0,0,.65);
  --sh-acc:0 10px 28px -10px rgba(74,99,240,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:
    radial-gradient(1100px 720px at 14% -8%, rgba(74,99,240,.13), transparent 60%),
    radial-gradient(900px 640px at 100% 0%, rgba(124,80,255,.09), transparent 55%),
    var(--bg);
  color:var(--txt);font-family:var(--ui);font-size:13.5px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim2);background-clip:padding-box}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0;text-align:left}
input,textarea,select{background:var(--surf2);border:1px solid var(--line2);border-radius:11px;padding:15px 16px;font-size:14.5px;width:100%;outline:none;transition:border-color .12s,box-shadow .12s}
input::placeholder,textarea::placeholder{color:var(--dim2)}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(74,99,240,.25)}
textarea{resize:vertical;min-height:76px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.p{color:var(--grn)} .n{color:var(--red)} .mut{color:var(--dim)} .tiny{font-size:11.5px}

/* ================= shell ================= */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc-hi),var(--acc));z-index:70}
.shell{display:flex;min-height:100vh}
aside{width:var(--sw);flex:none;background:linear-gradient(180deg,var(--side),var(--bg) 140%);border-right:1px solid var(--line);
  position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:60;transition:transform .22s ease}
main{flex:1;margin-left:var(--sw);min-width:0;display:flex;flex-direction:column}

/* brand */
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.brand .mk{flex:none;display:flex;align-items:center}
.brand .mk img{width:38px;height:auto;display:block;filter:drop-shadow(0 4px 12px rgba(74,99,240,.35))}
.brand b{font-size:13.5px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.25}
.brand span{font-family:var(--mono);font-size:9.5px;color:var(--acc-hi);letter-spacing:.14em;text-transform:uppercase;font-weight:600}

/* nav */
.navwrap{flex:1;overflow-y:auto;padding:10px 10px}
.navi{display:flex;align-items:center;gap:13px;width:100%;padding:11px 13px;color:var(--dim);
  font-weight:500;font-size:14px;transition:.14s;position:relative;border-radius:10px;margin-bottom:2px}
.navi:hover{background:var(--surf);color:#C9D1E0}
.navi.on{background:var(--surf2);color:#fff;font-weight:600;box-shadow:0 0 0 1px var(--line2) inset,var(--sh-sm)}
.navi.on svg{color:var(--acc-hi)}
.navi svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:.14s}
.navi .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim2);font-weight:500}
.navi.on .cnt{color:var(--acc-hi)}

/* sidebar foot */
.sfoot{border-top:1px solid var(--line);padding:14px 18px}
.sfoot .l{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--dim2);font-weight:600}
.sfoot .v{font-size:19px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.sfoot .s{font-size:11px;color:var(--dim2);margin-top:1px}

/* topbar */
.top{position:sticky;top:2px;z-index:40;background:rgba(7,8,15,.78);backdrop-filter:blur(20px) saturate(140%);
  border-bottom:1px solid var(--line);padding:0 40px;height:68px;display:flex;align-items:center;gap:14px}
.top h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.02em}
.top .ts{font-size:11.5px;color:var(--dim2);margin-top:-1px}
.top .sp{flex:1}
.burger{display:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);align-items:center;justify-content:center;flex:none;transition:.12s}
.burger:hover{background:var(--surf2)}
.burger svg{width:16px;height:16px;stroke:var(--txt);stroke-width:2;stroke-linecap:round}
.gearbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none;transition:.12s;color:var(--dim)}
.gearbtn:hover{background:var(--surf2);color:var(--txt);border-color:var(--line2)}
.gearbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* content */
.content{padding:26px 40px 60px;max-width:1440px;width:100%}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:55}

@media (max-width:900px){
  aside{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.5)}
  body.drawer aside{transform:none}
  body.drawer .scrim{display:block}
  main{margin-left:0}
  .burger{display:flex}
  .top{padding:0 16px;height:58px}
  .content{padding:20px 16px 70px}
  .card>.cb{padding:18px}
  .card>.ch{padding:16px 18px 0}
  .kpi{padding:18px}
}

/* ================= primitives ================= */
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;margin-bottom:20px;box-shadow:var(--sh-md)}
.card>.ch{display:flex;align-items:center;gap:10px;padding:20px 24px 0}
.card>.ch h3{font-size:13.5px;font-weight:650;margin:0;letter-spacing:-.01em;color:var(--txt)}
.card>.ch .cs{font-family:var(--mono);font-size:10px;color:var(--dim2);margin-left:auto;font-weight:500;letter-spacing:.05em}
.card>.cb{padding:24px}
.card>.cb.flush{padding:0}
.card>.ch+.cb{padding-top:17px}
.card>.ch+.cb.flush{padding-top:14px}
.lbl{font-size:11.5px;color:#9AA3B2;margin-bottom:6px;font-weight:500;letter-spacing:.01em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){   }
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.row{display:flex;gap:9px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sep{height:1px;background:var(--line);margin:14px 0}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;margin-bottom:18px;
  background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-md)}
.kpi{padding:17px 22px;border-right:1px solid var(--line);position:relative;transition:background .15s}
.kpi:hover{background:var(--surf2)}
.kpi:last-child{border-right:none}
@media (max-width:900px){ .kpi{border-right:none;border-bottom:1px solid var(--line)} .kpi:last-child{border-bottom:none} }
.kpi .k{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim2);font-weight:600}
.kpi .v{font-size:27px;font-weight:700;margin-top:8px;letter-spacing:-.04em;line-height:1}
.kpi .d{font-size:11.5px;color:var(--dim2);margin-top:6px}
.kpi .bar{height:3px;border-radius:2px;background:var(--surf3);margin-top:11px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:2px;background:var(--acc);transition:width .3s}
.kpi .bar i.p{background:var(--grn)} .kpi .bar i.n{background:var(--red)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;
  background:linear-gradient(180deg,var(--acc-hi),var(--acc));color:#fff;font-weight:600;font-size:13.5px;transition:.14s;border:1px solid transparent;
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset,var(--sh-acc)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 14px 32px -10px rgba(74,99,240,.5)}
.btn:active{transform:translateY(0)}
.btn:disabled{background:var(--surf3);color:var(--dim2);cursor:not-allowed;filter:none;box-shadow:none;transform:none}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--txt);box-shadow:none}
.btn.ghost:hover{background:var(--acc-gl);border-color:var(--acc-b);color:var(--acc-hi);filter:none;box-shadow:none}
.btn.danger{background:transparent;border-color:var(--red-b);color:var(--red);box-shadow:none}
.btn.danger:hover{background:var(--red-d);filter:none;box-shadow:none}
.btn.full{display:flex;width:100%}
.btn.lg{padding:12px 18px;font-size:14px}

/* segmented */
.seg{display:inline-flex;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--dim);transition:.14s;white-space:nowrap}
.seg button:hover{color:var(--acc-hi)}
.seg button.on:hover{color:#fff}
.seg button.on{background:linear-gradient(180deg,var(--acc-hi),var(--acc));color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 4px 14px -4px rgba(74,99,240,.5)}
.seg.full{display:flex} .seg.full button{flex:1;text-align:center}

/* pick */
.pick{display:flex;gap:9px}
.pick button{flex:1;padding:16px 13px;border-radius:11px;border:1.5px solid var(--line2);background:var(--surf2);
  font-weight:650;font-size:13.5px;color:var(--dim);transition:.14s;text-align:center;line-height:1.3}
.pick button:hover{border-color:var(--acc-b);color:var(--acc-hi);transform:translateY(-1px)}
.pick button small{display:block;font-size:10.5px;font-weight:500;opacity:.72;margin-top:3px}
.pick button.on{color:#fff;border-color:transparent;background:linear-gradient(180deg,var(--acc-hi),var(--acc));box-shadow:0 1px 0 rgba(255,255,255,.15) inset}
.pick.dir button.on[data-v=long]{border-color:transparent;background:linear-gradient(180deg,#4FCF94,var(--grn));box-shadow:0 1px 0 rgba(255,255,255,.15) inset}
.pick.dir button.on[data-v=short]{border-color:transparent;background:linear-gradient(180deg,#F4767E,var(--red));box-shadow:0 1px 0 rgba(255,255,255,.15) inset}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:10px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surf2);font-size:12.5px;color:var(--dim);font-weight:550;transition:.14s}
.chip:hover{color:var(--acc-hi);border-color:var(--acc-b)}
.chip.on{border-color:transparent;background:linear-gradient(180deg,var(--acc-hi),var(--acc));color:#fff;font-weight:600}
.chip.on[data-tone=g]{border-color:var(--grn-b);background:var(--grn-d);color:var(--grn)}
.chip.on[data-tone=r]{border-color:var(--red-b);background:var(--red-d);color:var(--red)}
.chip.on[data-tone=a]{border-color:var(--amb-b);background:var(--amb-d);color:var(--amb)}

/* derived */
.derived{display:flex;align-items:center;gap:9px;background:var(--acc-gl);border:1px solid var(--acc-b);
  border-radius:9px;padding:10px 13px;font-size:13px;color:#C4D8FB}
.derived b{font-weight:650;color:#DCE8FB}

/* ============ gate ladder (signature) ============ */
.ladder{margin:0}
.gate{position:relative;padding:0 0 0 38px;min-height:48px;display:flex;align-items:center;width:100%;transition:.1s}
.gate::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:var(--line2)}
.gate:first-child::before{top:22px} .gate:last-child::before{bottom:22px}
.gate.on::before{background:var(--grn)}
.gate.off::before{background:repeating-linear-gradient(180deg,var(--line2) 0 3px,transparent 3px 7px)}
.gate.off.crit::before{background:repeating-linear-gradient(180deg,var(--red) 0 3px,transparent 3px 7px)}
.gate .dot{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;
  border:2px solid var(--line2);background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;font-family:var(--mono);color:var(--dim2);transition:.13s}
.gate.on .dot{background:var(--grn);border-color:var(--grn);color:#06170E}
.gate.off.crit .dot{border-color:var(--red);color:var(--red)}
.gate .gtxt{font-size:13px;color:var(--dim);padding:7px 0;line-height:1.35}
.gate.on .gtxt{color:var(--txt)}
.gate.off.crit .gtxt{color:#F2989C}
.gate:not(:disabled):hover .gtxt{color:var(--txt)}
.crit-tag{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--red);margin-left:6px;vertical-align:1px}

/* grade */
.grade{display:inline-flex;align-items:center;gap:7px;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:600;border:1px solid}
.grade .g{font-family:var(--mono);font-size:14px;font-weight:700}
.g-A{color:var(--grn);border-color:var(--grn-b);background:var(--grn-d)}
.g-B{color:var(--amb);border-color:var(--amb-b);background:var(--amb-d)}
.g-C{color:var(--red);border-color:var(--red-b);background:var(--red-d)}

/* calc */
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.calc div{background:var(--surf2);padding:10px 8px;text-align:center}
.calc .k{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim2);font-weight:600}
.calc .v{font-size:16px;font-weight:650;margin-top:2px}
.calc .v.bad{color:var(--red)} .calc .v.ok{color:var(--grn)}

/* flags */
.flag{display:flex;gap:8px;background:var(--red-d);border:1px solid var(--red-b);border-radius:9px;
  padding:9px 12px;font-size:12.5px;color:#F3A5A8;margin-top:9px;line-height:1.45}
.flag.warn{background:var(--amb-d);border-color:var(--amb-b);color:#F2D091}
.flag.ok{background:var(--grn-d);border-color:var(--grn-b);color:#8FDCB6}
.flag.info{background:var(--acc-d);border-color:var(--acc-b);color:#AFC8F2}
.flag b{font-weight:700}
.flag:first-child{margin-top:0}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim2);font-weight:600;
  padding:14px 24px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:15px 24px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:var(--acc-gl)}
.tbl .rv{font-weight:700;font-size:13.5px}
.gpill{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px}
.gpill.A{background:var(--grn-d);color:var(--grn)} .gpill.B{background:var(--amb-d);color:var(--amb)} .gpill.C{background:var(--red-d);color:var(--red)}
.dirtag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;margin-right:7px}
.dirtag.long{color:var(--grn)} .dirtag.short{color:var(--red)}
@media (max-width:760px){
  .tbl .opt{display:none}
  .tbl th,.tbl td{padding:10px 12px}
}

/* quadrants */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.q{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--surf2);min-height:112px;display:flex;flex-direction:column;transition:.14s}
.q:hover{border-color:var(--line2)}
.q .qn{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.03em}
.q .qt{font-size:11.5px;font-weight:650;margin-top:7px;line-height:1.3}
.q .qd{font-size:10.5px;color:var(--dim2);margin-top:auto;padding-top:7px;line-height:1.35}
.q .qt{letter-spacing:.01em}
.q.edge{border-color:var(--grn-b);background:var(--grn-d)} .q.edge .qn{color:var(--grn)}
.q.good{border-color:var(--line2)} .q.good .qn{color:var(--dim)}
.q.bill{border-color:var(--red-b);background:var(--red-d)} .q.bill .qn{color:var(--red)}
.q.dirty{border-color:var(--amb);background:var(--amb-d)} .q.dirty .qn{color:var(--amb)} .q.dirty .qt{color:#F2D091}

/* stat rows */
.st{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:15px 24px;border-bottom:1px solid var(--line);font-size:13px}
.st:last-child{border-bottom:none}
.st .sk{color:var(--dim)} .st .sv{font-weight:650;flex:none}
.st .sv.thin{color:var(--dim2);font-size:11px}

/* compare */
.gapv{font-family:var(--mono);font-size:12px;font-weight:650}
.gapv.thin{color:var(--dim2);font-weight:600;font-size:10.5px}

/* insight */
.ins{border-left:2.5px solid var(--line2);padding:1px 0 1px 13px;margin:0 0 14px;font-size:13px;line-height:1.55}
.ins:last-child{margin-bottom:0}
.ins.p{border-color:var(--grn)} .ins.n{border-color:var(--red)} .ins.a{border-color:var(--amb)}
.ins b{font-weight:650}
.ins .rx{display:block;margin-top:5px;font-size:12px;color:var(--dim)}

/* shots */
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shot{position:relative;aspect-ratio:4/3;border:1px dashed var(--line2);border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;background:var(--surf2);overflow:hidden;font-size:10px;color:var(--dim2);
  font-weight:650;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;transition:.12s}
.shot:hover{border-color:var(--acc);color:var(--acc-hi);background:var(--acc-d)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .tag{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.88));padding:14px 7px 5px;font-size:9px;letter-spacing:.08em;color:#D6DCE6;text-align:center}
.shot .x{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.8);color:#fff;font-size:12px;text-align:center;line-height:20px;z-index:2}
.shot .plus{font-size:19px;font-weight:300;color:var(--line2)}
.diag{margin-top:12px;padding:12px 14px;background:var(--surf2);border:1px solid var(--line);border-radius:9px;
  font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--dim);white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.shot .dhint{font-size:8px;letter-spacing:.06em;opacity:.55;text-transform:none}
.shots.dz{border-radius:11px;transition:.14s}
.shots.dz.over{outline:2px dashed var(--acc);outline-offset:5px;background:var(--acc-d)}
.shots.dz.over .shot{border-color:var(--acc);color:var(--acc-hi)}
.dlshot.ph{display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;border:1px dashed var(--line2);
  border-radius:10px;background:var(--surf2);font-size:11px;color:var(--dim2);letter-spacing:.04em}

/* trade list */
.daycard{margin-bottom:16px}
.dayhd{background:var(--surf2);border-radius:16px 16px 0 0;padding:16px 24px !important;margin:-1px -1px 0;width:calc(100% + 2px)}
.dayhd h3{font-size:16px;font-weight:700;text-transform:capitalize;letter-spacing:-.01em}
.dayhd .dtot{font-family:var(--mono);font-size:14px;font-weight:700;margin-left:auto}
.tl{border-top:1px solid var(--line)}
.cb.flush>.tl:first-child{border-top:none}
.tlh{display:flex;align-items:center;width:100%;padding:17px 24px 17px 26px;position:relative;transition:.14s}
.tlh:hover{background:var(--surf2)}
.tlh.on{background:var(--surf2)}
.tlh .qbar{position:absolute;left:12px;top:16px;bottom:16px;width:3px;border-radius:2px;background:var(--line2)}
.tlh.q-edge .qbar{background:var(--grn)}
.tlh.q-dirty .qbar{background:var(--amb)}
.tlh.q-bill .qbar{background:var(--red)}
.tlh.q-good .qbar{background:var(--dim2)}
.tln{flex:1;text-align:left;font-size:14.5px;font-weight:600}
.tlr{font-size:15.5px;font-weight:700;flex:none;text-align:right}
.tlr .tlrr{display:block;font-size:11.5px;color:var(--dim2);font-weight:500;margin-top:3px}
.tld{padding:4px 26px 26px;background:var(--bg);border-top:1px solid var(--line)}
.pxg{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:9px;overflow:hidden;margin:20px 0 14px}
.pxg>div{background:var(--surf2);padding:11px 12px}
.pxg span{display:block;font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.09em}
.pxg b{display:block;font-size:14px;font-weight:600;margin-top:4px}
@media (max-width:640px){ .pxg{grid-template-columns:1fr 1fr} }

/* calendar */
.calhd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.calhd span{font-size:10px;text-align:center;color:var(--dim2);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .cell{aspect-ratio:1/.46;border-radius:11px;border:1px solid var(--line);background:var(--surf2);box-shadow:var(--sh-sm);
  padding:7px 9px;display:flex;flex-direction:column;align-items:flex-start;transition:.14s;width:100%}
.cal .cell.pad{background:transparent;border-color:transparent;pointer-events:none}
.cal .cell.none{opacity:.4}
.cal .cell:disabled{cursor:default}
.cal .cell.win{background:linear-gradient(155deg,var(--grn-d),var(--surf2) 130%);border-color:var(--grn-b)}
.cal .cell.loss{background:linear-gradient(155deg,var(--red-d),var(--surf2) 130%);border-color:var(--red-b)}
.cal .cell:not(.pad):not(:disabled):hover{border-color:var(--acc);cursor:pointer;transform:translateY(-1px);box-shadow:var(--sh-md)}
.cal .cellhd{display:flex;justify-content:space-between;align-items:center;width:100%}
.cal .dn{font-size:10.5px;color:var(--dim2);font-weight:600}
.cal .dct{font-family:var(--mono);font-size:9px;color:var(--dim2);font-weight:700}
.cal .cell.tilt .dct{color:var(--amb)}
.cal .cell.win .dn{color:#8FDCB6}
.cal .cell.loss .dn{color:#F3A5A8}
.cal .dr{font-family:var(--mono);font-size:11px;font-weight:700;margin-top:auto;letter-spacing:-.04em}
.cal .dv{font-size:8.5px;color:var(--red);font-weight:700;margin-top:1px}

/* day-log: large stacked screenshots, one per trade */
/* thumbnails are a fixed size whatever the count, so one shot does not fill the page.
   click opens the lightbox for the real thing */
.dlshots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:780px}
@media (max-width:560px){ .dlshots{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))} }
.dlshot{border-radius:10px;overflow:hidden;border:1px solid var(--line2);cursor:zoom-in;background:var(--surf2);transition:.14s}
.dlshot:hover{border-color:var(--acc)}
.dlshot img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.grow{flex:1}
.dlcard{overflow:hidden}
.dlgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){ .dlgrid{grid-template-columns:1fr} }
.dlbox{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:14px 15px}
.dlbox-t{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim2);font-weight:700;text-align:center;margin-bottom:10px}
.dlbox-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.dlbox-row:first-of-type{border-top:none}
.dlbox-row span{font-size:11.5px;color:var(--dim)}
.dlbox-row b{font-size:13px;font-weight:700}
.dlhd{display:flex;align-items:center;gap:12px;width:100%;padding:20px 24px;transition:background .12s}
.dlhd:hover{background:var(--surf2)}
.dlhd-name{font-size:15px;font-weight:700}
.dlchev{color:var(--dim2);transition:transform .16s;flex:none}
.dlchev.on{transform:rotate(180deg);color:var(--txt)}
.calnav{display:flex;align-items:center;gap:10px}
.calnav button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.calnav button:hover{border-color:var(--acc);color:var(--acc)}
@media (max-width:600px){ .cal .dr{font-size:10.5px} .cal .cell{padding:5px} }

/* sheet */
.ovl{position:fixed;inset:0;background:rgba(5,7,10,.68);z-index:100;display:grid;place-items:center;padding:24px;overflow-y:auto}
.sheet{background:var(--surf);border:1px solid var(--line2);border-radius:20px;width:100%;max-width:720px;
  max-height:92vh;overflow-y:auto;box-shadow:var(--sh-lg)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:26px 40px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--surf);z-index:2;border-radius:20px 20px 0 0}
.sheet .hd h2{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}
.sheet .hd button{font-size:12.5px;color:var(--dim);font-weight:600;padding:6px 10px;border-radius:7px}
.sheet .hd button:hover{background:var(--surf2);color:var(--txt)}
.sheet .sb{padding:8px 40px 40px}
@media (max-width:780px){
  .ovl{padding:10px}
  .sheet{max-width:100%;max-height:94vh}
  .sheet .hd{padding:20px 22px}
  .sheet .sb{padding:6px 22px 28px}
}
/* sections inside the panel: separated by space, not by nested boxes */
.sect{padding:36px 0;border-bottom:1px solid var(--line)}
.sect:first-child{padding-top:8px}
.sect:last-of-type{border-bottom:none;padding-bottom:8px}
.sect h4{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim2);margin:0 0 20px;font-weight:700}
.sect h4 span{float:right;text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim2)}
/* answered questions collapse to one line so the eye only ever meets one open decision */
.sect.secdone{padding:0}
.secsum{display:flex;align-items:center;gap:12px;width:100%;padding:18px 0;transition:.12s}
.secsum:hover .ssedit{color:var(--acc-hi)}
.secsum .ssl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);font-weight:700;flex:none}
.secsum .ssv{font-size:14px;font-weight:650;color:var(--txt)}
.secsum .ssedit{margin-left:auto;font-size:12px;color:var(--dim2);font-weight:600;flex:none}
/* one clear guided column, not a cramped grid */
.sflow{max-width:560px;margin:0 auto}

/* session strip */
.sbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:26px}
.sbar>div{flex:none}
.sbar .grow{flex:1;min-width:180px}
.sbar .vaf{display:flex;gap:10px}
.sbar .vaf input{width:110px}
.sbar .rth{display:flex;flex-direction:column;gap:4px;padding-right:26px;border-right:1px solid var(--line);align-self:stretch;justify-content:flex-end}
.sbar .rth .r1{font-size:13px;font-weight:600}
.sbar .rth .r2{font-size:11.5px;color:var(--dim2)}
.sbar .pick{min-width:250px}
@media (max-width:760px){ .sbar{gap:18px} .sbar .rth{border-right:none;padding-right:0;width:100%} .sbar .pick{width:100%} }

.ovl.lightbox{background:rgba(3,5,9,.92);cursor:zoom-out;padding:40px}
.ovl.lightbox img{max-width:100%;max-height:90vh;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.7)}

/* misc */
.empty{text-align:center;padding:44px 18px;color:var(--dim2);font-size:13px;line-height:1.65}
.banner{background:var(--amb-d);border:1px solid var(--amb-b);color:#F2D091;border-radius:9px;padding:11px 13px;font-size:12px;margin-bottom:14px;line-height:1.5}
.banner.info{background:var(--acc-d);border-color:var(--acc-b);color:#AFC8F2}
.pre{white-space:pre-wrap;font-size:13.5px;line-height:1.65}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";
/* ============ storage: Supabase (journal_kv table), in-memory fallback if offline ============ */
const SUPABASE_URL = "https://kdcupoxkzlranhzejwzl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkY3Vwb3hremxyYW5oemVqd3psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDU4NTksImV4cCI6MjEwMTA4MTg1OX0.A6x56QMh7FMiUf6HacMRs0EVQxLs68BXdflzygFlPw0";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DB = (() => {
  const mem = {};              /* write-through mirror, so a failed read still has something to serve */
  const pending = new Map();   /* writes that never reached the server, replayed when it comes back */
  let degraded = false, lastErr = null;

  const isFatal = e => /quota|storage|exceed|too large|payload/i.test((e?.name || "") + " " + (e?.message || ""));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const note = e => {
    lastErr = [e?.code, e?.message || String(e), e?.details, e?.hint].filter(Boolean).join(" · ");
    return e;
  };

  async function upsert(k, v) {
    const { error } = await sb.from("journal_kv").upsert({ key: k, value: v, updated_at: new Date().toISOString() });
    if (error) throw note(error);
  }
  /* a dropped packet is not a broken database: retry before giving up on the network */
  async function attempt(fn, tries = 3) {
    let last;
    for (let i = 0; i < tries; i++) {
      try { const r = await fn(); degraded = false; return r; }
      catch (e) { last = note(e); if (isFatal(e)) throw e; if (i < tries - 1) await sleep(250 * (i + 1)); }
    }
    throw last;
  }
  async function flush() {
    if (!pending.size) return;
    for (const [k, v] of [...pending]) {
      try { await upsert(k, v); pending.delete(k); }
      catch (_) { degraded = true; return; }   /* still down, keep the rest queued */
    }
    degraded = false;                          /* backlog cleared, we are in sync again */
  }
  async function write(k, v, strict) {
    mem[k] = v;
    try { await attempt(() => upsert(k, v)); pending.delete(k); await flush(); }
    catch (e) {
      if (strict && isFatal(e)) throw e;
      degraded = true; pending.set(k, v);   /* keep it, replay it later */
    }
  }
  return {
    get isMemory() { return degraded; },
    get unsynced() { return pending.size; },
    get lastError() { return lastErr; },
    flush,
    /* bypasses the mirror and the retry loop: used only by the diagnostic */
    async probe(k, v) {
      if (v === undefined) {
        const { data, error } = await sb.from("journal_kv").select("value").eq("key", k).maybeSingle();
        if (error) throw note(error);
        return data ? data.value : undefined;
      }
      const { error } = await sb.from("journal_kv").upsert({ key: k, value: v, updated_at: new Date().toISOString() });
      if (error) throw note(error);
    },
    async probeDel(k) { await sb.from("journal_kv").delete().eq("key", k); },
    async get(k) {
      try {
        const r = await attempt(async () => {
          const { data, error } = await sb.from("journal_kv").select("value").eq("key", k).maybeSingle();
          if (error) throw error;
          return data ? data.value : undefined;
        });
        flush();
        return r;
      } catch (e) { degraded = true; return mem[k]; }
    },
    set: (k, v) => write(k, v, false),
    /* images: a full disk must surface so the user can free space; a flaky network just queues */
    setStrict: (k, v) => write(k, v, true),
    async del(k) {
      delete mem[k]; pending.delete(k);
      try { await attempt(async () => { const { error } = await sb.from("journal_kv").delete().eq("key", k); if (error) throw error; }); }
      catch (_) { degraded = true; }
    }
  };
})();
/* retry the backlog as soon as the machine looks online again */
window.addEventListener("online", () => DB.flush().then(() => render()));
document.addEventListener("visibilitychange", () => { if (!document.hidden) DB.flush(); });

/* ============ state ============ */
const DEFAULT_CFG = {
  instrument: "MES",
  pointValue: 5,
  accountSize: 0,
  rthStart: "15:30",
  rthEnd: "22:00",
  maxTrades: 3,
  riskPct: 1,
  riskIsCeiling: true,
  dailyLossR: 2,
  sweepMandatory: true,
  cooldownMin: 20,
  minRR1: 2,
  minRR2: 2,
  apiKey: "",
  model: "claude-sonnet-5"
};

let S = { cfg: { ...DEFAULT_CFG }, trades: [], days: {}, va: {}, tab: "dashboard", openTrade: null, sessLimit: 12, cal: null, dayView: null, dlOpen: {}, coach: null };
let draft = null, editing = null, sheet = null, busy = {}, editSec = null, editMode = false;

/* images live under their own keys so the state blob stays small */
const IMG = {};
const MAX_SHOTS = 3;
/* accepts both the old labelled object and the current flat list */
const shotKeys = t => {
  const s = t?.shots;
  if (!s) return [];
  return (Array.isArray(s) ? s : ["contesto", "entrata", "uscita"].map(k => s[k])).filter(Boolean);
};
const shotURL = k => !k ? null : String(k).startsWith("data:") ? k : IMG[k] || null;
/* keys we asked the database for and got nothing back: prevents an endless reload loop */
const IMGMISS = new Set();
const shotMissing = k => !!k && !String(k).startsWith("data:") && !IMG[k] && IMGMISS.has(k);
async function putShot(dataURL) {
  const k = "s" + uid();
  try { await DB.setStrict("img:" + k, dataURL); }
  catch (e) {
    const quota = e && /quota|storage/i.test(e.name + " " + e.message);
    throw new Error(quota
      ? "Spazio esaurito. Esporta un backup, poi libera spazio eliminando i trade più vecchi."
      : "Impossibile salvare l'immagine. Riprova.");
  }
  IMG[k] = dataURL;
  IMGMISS.delete(k);
  trimCache();
  return k;
}
/* keys on screen right now: evicting these would make the view flicker back to placeholders */
function pinnedKeys() {
  const out = new Set();
  const add = t => shotKeys(t).forEach(k => out.add(k));
  if (draft) add(draft);
  if (S.dayView) S.trades.filter(t => t.date === S.dayView).forEach(add);
  return out;
}
function trimCache() {
  const pin = pinnedKeys();
  const ks = Object.keys(IMG).filter(k => !pin.has(k));
  const over = Object.keys(IMG).length - 60;
  if (over > 0) ks.slice(0, over).forEach(k => delete IMG[k]);
}
async function dropShots(t) {
  for (const k of shotKeys(t))
    if (!String(k).startsWith("data:")) { delete IMG[k]; await DB.del("img:" + k); }
}
async function storageInfo() {
  try {
    const e = await navigator.storage.estimate();
    return { used: e.usage || 0, quota: e.quota || 0 };
  } catch (_) { return null; }
}
/* images are fetched lazily, so any view that shows them hydrates then repaints once */
async function loadShots(...trades) {
  const want = new Set();
  trades.flat().filter(Boolean).forEach(t => shotKeys(t).forEach(k => {
    if (k && !String(k).startsWith("data:") && !IMG[k] && !IMGMISS.has(k)) want.add(k);
  }));
  if (!want.size) return false;
  let got = 0;
  await Promise.all([...want].map(async k => {
    try {
      const v = await DB.get("img:" + k);
      if (v) { IMG[k] = v; got++; } else IMGMISS.add(k);
    } catch (_) { IMGMISS.add(k); }
  }));
  return got > 0;
}
/* which trades the current view is actually showing pictures for */
function visibleShotTrades() {
  const out = [];
  if (draft) out.push(draft);
  if (S.tab === "calendario" && S.dayView)
    out.push(...S.trades.filter(t => t.date === S.dayView && S.dlOpen[t.id]));
  return out;
}
let hydrating = false;
async function hydrateShots() {
  if (hydrating) return;
  const list = visibleShotTrades();
  if (!list.length) return;
  hydrating = true;
  let changed = false;
  try { changed = await loadShots(list); }
  finally { hydrating = false; }
  if (changed) render();
}

/* every tab gets an identity so a stale one cannot silently overwrite a newer device */
const SESSION = "w" + Math.random().toString(36).slice(2, 9);
let stateRev = 0, saveChain = Promise.resolve(), saveTimer = null;

async function doSave() {
  if (!DB.isMemory) {
    const meta = await DB.get("state_meta");
    if (meta && meta.rev > stateRev && meta.by !== SESSION) {
      const keep = confirm(
        "Un altro dispositivo ha salvato dati più recenti di questa scheda.\n\n" +
        "OK: tieni questa scheda e sovrascrivi l'altro dispositivo.\n" +
        "Annulla: ricarica e riprendi dai dati più recenti.");
      if (!keep) { location.reload(); return; }
      stateRev = meta.rev;
    }
  }
  stateRev++;
  await DB.set("state", { cfg: S.cfg, trades: S.trades, days: S.days, va: S.va });
  await DB.set("state_meta", { rev: stateRev, by: SESSION, at: Date.now() });
}
/* one writer at a time on a single row, whatever order the callers arrive in */
function save() {
  saveChain = saveChain.then(doSave, doSave);
  return saveChain;
}
/* typing in settings fired one full-state upsert per keystroke: coalesce instead */
function queueSave(ms = 700) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; save(); }, ms);
}
window.addEventListener("beforeunload", () => { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; save(); } });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ============ helpers ============ */
const $ = s => document.querySelector(s);

const n = v => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : 0; };
const has = v => v !== "" && v != null && isFinite(parseFloat(String(v).replace(",", ".")));
/* everything is anchored to Italian wall-clock time, whatever the device says */
const TZ = "Europe/Rome";
const tzFmt = new Intl.DateTimeFormat("en-GB", {
  timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", hourCycle: "h23"
});

const today = () => { const p = tzNow(); return `${p.year}-${p.month}-${p.day}`; };
const nowHM = () => { const p = tzNow(); return `${p.hour}:${p.minute}`; };
const fmtR = r => (r >= 0 ? "+" : "") + r.toFixed(2) + "R";
const fmtPct = v => v.toFixed(0) + "%";

const dShort = d =>

const lc1 = s => s.charAt(0).toLowerCase() + s.slice(1);
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

const hm2min = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return h * 60 + m; };
const minsNow = () => { const p = tzNow(); return +p.hour * 60 + +p.minute; };
function sessionState() {
  const a = hm2min(S.cfg.rthStart), b = hm2min(S.cfg.rthEnd), n = minsNow();
  if (n < a) return { open: false, mins: a - n, label: "Apre tra" };
  if (n >= b) return { open: false, mins: null, label: "Chiusa" };
  return { open: true, mins: b - n, label: "Chiude tra" };
}
const durLabel = m => m == null ? "" : m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
const vaOf = d => S.va?.[d] || {};
/* how much of the planned move actually got taken */
function efficiency(list) {
  const w = list.filter(t => won(t) && plannedRR(t) > 0);
  return w.length ? avg(w.map(t => realisedR(t) / plannedRR(t))) * 100 : null;
}
function cooldown() {
  const mins = n(S.cfg.cooldownMin);
  if (!mins) return null;
  const last = live().filter(t => t.date === today() && t.closed && t.closedAt && lost(t))
    .sort((a, b) => b.closedAt - a.closedAt)[0];
  if (!last) return null;
  const left = Math.ceil(mins - (Date.now() - last.closedAt) / 60000);
  return left > 0 ? left : null;
}

/* ============ strategy model ============ */
const SETUPS = {

};
const isCrit = g => !!(g.crit || (g.critIf && S.cfg[g.critIf]));
const gatesOf = t => SETUPS[t.setup].gates;

const DAY_TYPES = { trending: "Trending", range: "Range" };
const setupForDay = d => d === "range" ? 2 : 1;
const MANUAL_REASONS = [
  "Struttura cambiata", "Volume esaurito", "Ho voluto incassare",
  "Mi sono innervosito", "Sessione in chiusura"
];
const OUTCOMES = { target: "Target", stop: "Stop", manual: "Chiusura manuale", be: "Breakeven" };

/* ============ computations ============ */
function grade(t) {
  const gs = gatesOf(t);
  const miss = gs.filter(g => !t.gates?.[g.k]);
  if (miss.some(isCrit)) return "C";
  if (miss.length === 0) return "A";
  if (miss.length >= 3) return "C";
  return "B";
}
function missingGates(t) {
  return gatesOf(t).filter(g => !t.gates?.[g.k]).map(g => g.t(t.dir));
}
function riskPts(t) { return has(t.entry) && has(t.stop) ? Math.abs(n(t.entry) - n(t.stop)) : 0; }
function plannedRR(t) {
  const r = riskPts(t);
  return r && has(t.target) ? Math.abs(n(t.target) - n(t.entry)) / r : 0;
}
function realisedR(t) {
  const r = riskPts(t);
  if (!r || !t.closed) return null;
  if (t.outcome === "be") return 0;
  if (!has(t.exitPrice)) {
    if (t.outcome === "target") return plannedRR(t);
    if (t.outcome === "stop") return -1;
    return null;
  }
  const sign = t.dir === "long" ? 1 : -1;
  return ((n(t.exitPrice) - n(t.entry)) * sign) / r;
}
function riskMoney(t) { return riskPts(t) * n(S.cfg.pointValue) * Math.max(1, n(t.size)); }
function riskAccountPct(t) {
  const a = n(S.cfg.accountSize);
  return a > 0 ? riskMoney(t) / a * 100 : null;
}
/* R multiplied by the money actually at risk gives the real P&L */
function pnlMoney(t) {
  const r = realisedR(t);
  return r == null ? null : r * riskMoney(t);
}
const sumMoney = list => list.reduce((a, t) => a + (pnlMoney(t) || 0), 0);
const fmtM = v => (v < 0 ? "-" : "+") + "$" + Math.abs(v).toFixed(Math.abs(v) >= 1000 ? 0 : 2);

function inRTH(t) {
  if (!t.time) return true;
  const a = hm2min(S.cfg.rthStart), b = hm2min(S.cfg.rthEnd), x = hm2min(t.time);
  if (a === b) return true;
  return a < b ? (x >= a && x <= b) : (x >= a || x <= b); /* b < a = finestra a cavallo della mezzanotte */
}
const rthFlag = t => inRTH(t) ? ""
  : `<div class="flag"><span>Fuori dalla finestra RTH (${esc(S.cfg.rthStart)}–${esc(S.cfg.rthEnd)}).</span></div>`;
const riskFlag = t => {
  const m = riskMoney(t), pc = riskAccountPct(t);
  if (!m) return "";
  const over = pc != null && pc > n(S.cfg.riskPct) + 0.05;
  return `<div class="flag ${over ? "" : "info"}"><span>Rischio <b>$${m.toFixed(2)}</b>${pc != null ? ` · <b>${pc.toFixed(2)}%</b> del conto` : ""}${over ? `. Oltre il ${S.cfg.riskPct}% previsto.` : ""}</span></div>`;
};
/* auto-detected rule breaches, computed not self-reported */
function violations(t) {
  const v = [];
  const rr = plannedRR(t), g = grade(t);
  if (g === "C") missingGates(t).filter((_, i) => true).length && v.push("Sequenza incompleta su un elemento critico");
  if (!inRTH(t)) v.push("Trade fuori RTH");
  const minRR = t.setup === 1 ? S.cfg.minRR1 : S.cfg.minRR2;
  if (rr && rr < minRR - 0.01) v.push(`Target sotto il minimo ${minRR}R (${rr.toFixed(1)}R)`);
  if (t.dayType && SETUPS[t.setup].ideal !== t.dayType)
    v.push(`${SETUPS[t.setup].name} su giornata ${DAY_TYPES[t.dayType].toLowerCase()}`);
  const va = t.mode === "live" ? vaOf(t.date) : null;
  if (va && has(va.vah) && has(va.val) && has(t.entry)) {
    const vah = n(va.vah), val = n(va.val), en = n(t.entry), tol = (vah - val) * 0.02;
    if (t.setup === 1) {
      /* rule 2 requires acceptance outside the Value Area, so the entry cannot sit inside it */
      if (t.dir === "long" && en < vah - tol) v.push("Entrata dentro la Value Area su un breakout long");
      if (t.dir === "short" && en > val + tol) v.push("Entrata dentro la Value Area su un breakout short");
    } else if (has(t.target)) {
      /* rule 7 puts the target on the other side of the Value Area */
      const tg = n(t.target), want = t.dir === "long" ? vah : val;
      if (Math.abs(tg - want) > (vah - val) * 0.25)
        v.push(`Target lontano dall'altra parte della Value Area (${want})`);
    }
  }
  const rp = riskAccountPct(t);
  if (rp != null && rp > n(S.cfg.riskPct) + 0.05)
    v.push(`Rischio ${rp.toFixed(2)}% del conto, oltre il ${S.cfg.riskPct}%`);
  if (t.closed && t.outcome === "manual" && (t.manualReason === "Ho voluto incassare" || t.manualReason === "Mi sono innervosito"))
    v.push("Uscita senza motivo strutturale");
  return v;
}
function clean(t) { return grade(t) !== "C" && violations(t).length === 0; }
function won(t) { const r = realisedR(t); return r != null && r > 0.05; }
function lost(t) { const r = realisedR(t); return r != null && r < -0.05; }
function quadrant(t) {
  if (!t.closed) return null;
  const c = clean(t), w = won(t), l = lost(t);
  if (!w && !l) return c ? "good" : "bill";
  if (c && w) return "edge";
  if (c && l) return "good";
  if (!c && l) return "bill";
  return "dirty";
}
const QUAD = {
  edge: { t: "Esecuzione corretta · Vinto", d: "Il tuo edge. Da ripetere.", cls: "edge" },
  good: { t: "Esecuzione corretta · Perso", d: "Perdita buona. Il costo di stare sul mercato.", cls: "good" },
  bill: { t: "Esecuzione rotta · Perso", d: "Il conto da pagare.", cls: "bill" },
  dirty: { t: "Esecuzione rotta · Vinto", d: "Vincita sporca. La più pericolosa.", cls: "dirty" }
};

const offDay = t => !!(t.dayType && SETUPS[t.setup].ideal !== t.dayType);

const live = () => S.trades.filter(t => t.mode === "live");
const bt = () => S.trades.filter(t => t.mode === "backtest");
const closed = a => a.filter(t => t.closed && realisedR(t) != null);
const bySession = d => live().filter(t => t.date === d).sort((a, b) => (a.time || "").localeCompare(b.time || ""));

/* ============ images: high ceiling, orderflow screenshots need detail ============ */
function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith("image/")) return rej(new Error("Non è un'immagine."));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("Impossibile leggere il file."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("Immagine non valida."));
      img.onload = () => {
        const MAX = 1500, TARGET = 240 * 1024;
        let { width: w, height: h } = img;
        if (w > MAX || h > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        /* step the quality down until it fits: charts stay legible well below 0.9 */
        let q = 0.86, out = c.toDataURL("image/jpeg", q);
        while (out.length * 0.75 > TARGET && q > 0.45) { q -= 0.08; out = c.toDataURL("image/jpeg", q); }
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* one path for the picker, drag-and-drop and paste, so all three respect the same cap */
async function addShots(files) {
  if (!draft) return;
  const imgs = [...files].filter(f => f && f.type && f.type.startsWith("image/"));
  if (!imgs.length) return;
  if (!Array.isArray(draft.shots)) draft.shots = shotKeys(draft);
  const room = MAX_SHOTS - draft.shots.length;
  if (room <= 0) return alert(`Massimo ${MAX_SHOTS} screenshot per trade.`);
  const take = imgs.slice(0, room);
  const skipped = imgs.length - take.length;
  try {
    for (const f of take) draft.shots.push(await putShot(await readImage(f)));
  } catch (err) { alert(err.message); }
  renderSheet();
  if (DB.isMemory)
    alert("Le immagini non sono arrivate al database e per ora restano solo in questa scheda.\n\nApri Impostazioni, Diagnostica archiviazione, ed esegui il test.");
  if (skipped) alert(`Aggiunte ${take.length}. Le altre ${skipped} superano il limite di ${MAX_SHOTS}.`);
}

/* ============ Claude ============ */
async function callClaude(body) {
  if (!S.cfg.apiKey) throw new Error("Aggiungi la tua chiave Claude in Impostazioni.");
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": S.cfg.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: S.cfg.model || "claude-sonnet-5", max_tokens: 1100, ...body })
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || "Errore API");
  return (j.content || []).map(c => c.type === "text" ? c.text : "").join("").trim();
}

function strategyBrief(t) {
  const s = SETUPS[t.setup];
  return `Strategia — ${s.full} (${t.dir === "long" ? "long" : "short"}):\n` +
    s.gates.map((g, i) => `${i + 1}. ${g.t(t.dir)}${isCrit(g) ? " [CRITICO]" : ""}`).join("\n") +
    `\n${s.stopHint(t.dir)}\n${s.targetHint(t.dir)}\nOperare solo in RTH.`;
}

/* image read of the entry structure — advisory only, never feeds statistics */
async function analyseEntry(t) {
  const imgs = shotKeys(t).map(shotURL).filter(Boolean);
  if (!imgs.length) throw new Error("Serve almeno uno screenshot.");
  const ticked = gatesOf(t).filter(g => t.gates?.[g.k]).map(g => g.t(t.dir));
  const txt = await callClaude({
    messages: [{
      role: "user",
      content: [
        ...imgs.map(u => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: u.split(",")[1] } })),
        {
          type: "text", text:
            `${strategyBrief(t)}\n\nIl trader ha dichiarato presenti questi elementi:\n${ticked.map(x => "- " + x).join("\n") || "- nessuno"}\n\n` +
            `Guarda ${imgs.length > 1 ? "gli screenshot" : "il grafico"} e valuta SOLO la struttura visibile intorno all'entrata: c'è un pullback verso il VWAP prima dell'ingresso? ` +
            `La candela di ingresso è una candela di iniziativa o una candela debole/di indecisione? L'entrata è sull'estremo o dopo un ritracciamento? ` +
            `Lo stop è coerente con il minimo/massimo di assorbimento o dello sweep?\n\n` +
            `Non leggere valori numerici di delta o singole celle del footprint: non sono affidabili da uno screenshot. Se un elemento non è visibile, dillo.\n\n` +
            `Rispondi in italiano ESATTAMENTE in questo formato:\nESITO: Confermato|Non confermato|Non valutabile\nNOTA: una sola frase, massimo 25 parole.`
        }
      ]
    }]
  });
  const m = /ESITO:\s*(Confermato|Non confermato|Non valutabile)/i.exec(txt);
  const nn = /NOTA:\s*([\s\S]+)/i.exec(txt);
  return {
    verdict: m ? m[1] : "Non valutabile",
    note: nn ? nn[1].trim().split("\n")[0] : txt.slice(0, 160),
    at: Date.now()
  };
}

function digest(list, label) {
  return `${label} — ${list.length} trade:\n` + list.map(t => {
    const r = realisedR(t);
    return `${t.mode === "backtest" ? (t.histDate || "") : t.date} ${t.time || ""} · Setup ${t.setup} ${SETUPS[t.setup].name} ${t.dir} · grado ${grade(t)} · ` +
      `mancanti: ${missingGates(t).join("; ") || "nessuno"} · RR pianificato ${plannedRR(t).toFixed(2)} · ` +
      `esito ${t.closed ? OUTCOMES[t.outcome] : "aperto"}${t.manualReason ? " (" + t.manualReason + ")" : ""} · ` +
      `R ${r == null ? "n/d" : r.toFixed(2)}${t.dayType ? " · giornata " + DAY_TYPES[t.dayType] : ""}` +
      `${t.reasoning ? "\n   ragionamento: " + t.reasoning.slice(0, 300) : ""}` +
      `${t.note ? "\n   note del trader: " + t.note.slice(0, 300) : ""}`;
  }).join("\n");
}

async function writtenRead() {
  const L = closed(live()).slice(-40);
  if (L.length < 5) throw new Error("Servono almeno 5 trade chiusi.");
  return callClaude({
    messages: [{
      role: "user", content:
        `Sei un coach di trading esigente e concreto. Il trader opera SOLO due setup su Value Area:\n` +
        `Setup 1 Breakout VA (ideale su giornate trending), Setup 2 Rifiuto VA (ideale su giornate range).\n\n` +
        digest(L, "Trade live") +
        `\n\nOgni trade può avere delle "note del trader": è il suo ragionamento a caldo, scritto da lui. Usale per capire lo stato mentale ` +
        `e i pattern comportamentali, non solo i numeri. Se un problema che il trader ha annotato in note più vecchie (impazienza, disagio, fretta, ` +
        `paura di perdere il livello) non compare più nelle note recenti mentre i numeri migliorano, dillo esplicitamente: è un segnale che quel ` +
        `punto si è corretto. Se invece lo stesso problema si ripete nelle note nel tempo, nominalo come un pattern non ancora risolto.\n\n` +

}

async function compareRead() {
  const L = closed(live()), B = closed(bt());
  if (L.length < 5 || B.length < 5) throw new Error("Servono almeno 5 trade chiusi per lato.");
  return callClaude({
    messages: [{
      role: "user", content:
        `Sei un coach di trading. Confronta l'esecuzione in backtest con quella dal vivo sulla stessa strategia (Setup 1 Breakout VA, Setup 2 Rifiuto VA su Value Area).\n\n` +
        digest(B.slice(-60), "BACKTEST") + "\n\n" + digest(L.slice(-60), "LIVE") +
        `\n\nIdentifica dove l'esecuzione dal vivo diverge dalla strategia testata: quali regole cedono sotto pressione, ` +
        `se qualche setup rende meno dal vivo per motivi che il backtest non può catturare, e se la frequenza dei trade cambia. ` +
        `Non confondere i due campioni in un'unica statistica. Se un campione è troppo piccolo per concludere, dillo.\n\n` +

}

  });
  if (editable && ks.length < MAX_SHOTS)
    tiles.push(`<div class="shot drop" data-addshot><span class="plus">+</span>Aggiungi<span class="dhint">o trascina</span></div>`);
  return `<div class="shots${editable ? " dz" : ""}" style="grid-template-columns:repeat(${Math.min(3, Math.max(1, tiles.length))},1fr)">${tiles.join("")}</div>`;
}

function kpi(k, v, d, tone, pct) {
  return `<div class="kpi"><div class="k">${esc(k)}</div><div class="v num ${tone || ""}">${v}</div>
    ${d ? `<div class="d">${esc(d)}</div>` : ""}
    ${pct != null ? `<div class="bar"><i class="${tone || ""}" style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>` : ""}</div>`;
}

/* trade table: the category lives on the row, not in a control */
function insightList(P) {
  return P.length ? P.map(p => `<div class="ins ${p.tone}"><b>${esc(p.title)}.</b> ${p.body}${p.rx ? `<span class="rx">${p.rx}</span>` : ""}</div>`).join("")
    : `<div class="tiny mut">Nessun pattern con campione sufficiente. Continua a registrare.</div>`;
}

/* ============ sheet: FASE 1, entrata ============ */
/* one source of truth, so the live refresh and the full render can never disagree */
function draftState(t) {
  const isBT = t.mode === "backtest";
  const dtv = isBT ? t.dayType : S.days[t.date];
  const seqOK = t.seq === "full" || (t.seq === "partial" && gatesOf(t).some(g => !t.gates?.[g.k]));
  const reasonOK = !isBT || (t.reasoning || "").trim().length > 3;
  const pricesOK = has(t.entry) && has(t.stop) && has(t.target);
  const outcomeOK = !!t.outcome && (t.outcome !== "manual" || !!t.manualReason);
  const ready = !!dtv && !!t.setup && !!t.dir && seqOK && pricesOK && reasonOK && outcomeOK;
  const label = ready ? (editMode ? "Salva modifiche" : "Salva il trade")
    : !dtv ? "Scegli il tipo di giornata"
    : !t.setup || !t.dir ? "Scegli setup e direzione"
    : !t.seq ? "Rispondi sulla sequenza"
    : !seqOK ? "Segna cosa mancava"
    : !pricesOK ? "Compila i tre prezzi"
    : !reasonOK ? "Scrivi il ragionamento"
    : t.outcome === "manual" && !t.manualReason ? "Indica perché sei uscito"
    : "Scegli l'esito";
  return { isBT, dtv, seqOK, ready, label };
}

  const ds = draftState(t);
  h += `</div><button class="btn lg full" data-savedraft ${ds.ready ? "" : "disabled"} style="margin-top:8px">${esc(ds.label)}</button>`;

function renderSheet() {
  const body = sheetEntry();
  let o = $(".ovl");
  if (!o) {
    o = document.createElement("div");
    o.className = "ovl";
    o.innerHTML = '<div class="sheet"></div>';
    document.body.appendChild(o);
    o.addEventListener("click", e => { if (e.target === o) closeSheet(); });
  }
  const i = body.indexOf("</div>") + 6;
  o.querySelector(".sheet").innerHTML = body.slice(0, i) + '<div class="sb">' + body.slice(i) + "</div>";
}
function closeSheet() {
  sheet = null; draft = null; editing = null; editSec = null; editMode = false;
  const o = $(".ovl"); if (o) o.remove();
}

/* ============ pattern engine ============ */
function group(list, fn) {
  const g = {};
  list.forEach(t => { const k = fn(t); if (k == null) return; (g[k] = g[k] || []).push(t); });
  return g;
}
const expR = a => avg(a.map(realisedR));
const winRate = a => a.length ? a.filter(won).length / a.length * 100 : 0;

function patterns(list) {
  const out = [];
  const MIN = 6;
  const add = (cond, tone, title, body, rx) => { if (cond) out.push({ tone, title, body, rx }); };

  /* the headline: sequence complete vs broken */
  const ok = list.filter(t => grade(t) === "A"), broke = list.filter(t => grade(t) === "C");
  if (ok.length >= MIN && broke.length >= 3) {
    const a = expR(ok), b = expR(broke);
    add(true, a > b ? "p" : "a", "Sequenza completa contro sequenza rotta",
      `Con la sequenza completa fai <b>${fmtR(a)}</b> di media su ${ok.length} trade. Con un elemento critico mancante fai <b>${fmtR(b)}</b> su ${broke.length}.`,
      a > b ? `La differenza è ${(a - b).toFixed(2)}R per trade. È il prezzo di ogni scorciatoia.` : null);
  }

  /* setup vs day type fit — straight from the sheet */
  [1, 2].forEach(sn => {
    const fit = list.filter(t => t.setup == sn && t.dayType === SETUPS[sn].ideal);
    const unfit = list.filter(t => t.setup == sn && t.dayType && t.dayType !== SETUPS[sn].ideal);
    if (fit.length >= 4 && unfit.length >= 4) {
      const a = expR(fit), b = expR(unfit), nm = SETUPS[sn].name;
      const day = SETUPS[sn].ideal === "trending" ? "trending" : "range";
      if (b < a - .2) add(true, "n", `${nm} fuori dalla giornata indicata`,
        `Sulle giornate ${day} rende <b>${fmtR(a)}</b>. Sulle altre <b>${fmtR(b)}</b> su ${unfit.length} trade.`,
        `Qui il foglio ha ragione. Per due settimane prendi il ${nm} solo sulle giornate ${day}.`);
      else if (b > a + .2) add(true, "p", `${nm} rende anche fuori giornata`,
        `Sulle giornate ${day} rende <b>${fmtR(a)}</b>. Sulle altre <b>${fmtR(b)}</b> su ${unfit.length} trade.`,
        `Il filtro sulla giornata non ti sta aiutando su questo setup. Il foglio lo dà come ideale, non come regola, e i tuoi dati lo confermano.`);
      else add(true, "p", `${nm} indifferente alla giornata`,
        `Dentro <b>${fmtR(a)}</b>, fuori <b>${fmtR(b)}</b>. Nessuna differenza che conti su ${fit.length + unfit.length} trade.`,
        `La classificazione della giornata non sta cambiando il risultato di questo setup.`);
    }
  });

  /* individual gates */
  const gateStats = {};
  list.forEach(t => gatesOf(t).forEach(g => {
    const key = g.t(t.dir);
    gateStats[key] = gateStats[key] || { on: [], off: [] };
    gateStats[key][t.gates?.[g.k] ? "on" : "off"].push(t);
  }));
  Object.entries(gateStats).forEach(([k, v]) => {
    if (v.off.length >= 4 && v.on.length >= MIN) {
      const a = expR(v.on), b = expR(v.off);
      add(b < a - .25, "n", "Elemento saltato",
        `Quando salti <b>${esc(lc1(k))}</b> la media è <b>${fmtR(b)}</b> su ${v.off.length} trade, contro <b>${fmtR(a)}</b> quando c'è.`,
        `Se l'elemento non c'è, non è il tuo setup. Non è un trade da prendere in versione ridotta.`);
    }
  });

  /* realised vs planned — cutting winners */
  const winners = list.filter(won);
  if (winners.length >= MIN) {
    const gap = avg(winners.map(t => realisedR(t) - plannedRR(t)));
    add(gap < -.3, "a", "Tagli i vincitori prima del target",
      `Sui trade vinti prendi in media <b>${gap.toFixed(2)}R</b> in meno di quanto avevi pianificato.`,
      `Per due settimane: una volta entrato, non tocchi nulla fino al target o allo stop.`);
  }

  /* manual exits without structural reason */
  const soft = list.filter(t => t.outcome === "manual" && (t.manualReason === "Ho voluto incassare" || t.manualReason === "Mi sono innervosito"));
  if (soft.length >= 3) {
    const hard = list.filter(t => t.outcome === "manual" && (t.manualReason === "Struttura cambiata" || t.manualReason === "Volume esaurito"));
    add(true, "a", "Uscite senza motivo strutturale",
      `${soft.length} trade chiusi perché volevi incassare o eri a disagio, media <b>${fmtR(expR(soft))}</b>${hard.length >= 3 ? `. Le uscite strutturali fanno <b>${fmtR(expR(hard))}</b>` : ""}.`,
      `Il disagio non è un segnale. La struttura sì.`);
  }

  /* setup comparison */
  const s1 = list.filter(t => t.setup == 1), s2 = list.filter(t => t.setup == 2);
  if (s1.length >= MIN && s2.length >= MIN) {
    const a = expR(s1), b = expR(s2);
    add(Math.abs(a - b) > .25, a > b ? "p" : "p", "I due setup non rendono uguale",
      `Breakout VA: <b>${fmtR(a)}</b> su ${s1.length} trade, ${fmtPct(winRate(s1))} vinti. Rifiuto VA: <b>${fmtR(b)}</b> su ${s2.length}, ${fmtPct(winRate(s2))} vinti.`,
      `Il setup più debole va portato in backtest, non tolto d'istinto.`);
  }

  /* long vs short */
  const lo = list.filter(t => t.dir === "long"), sh = list.filter(t => t.dir === "short");
  if (lo.length >= MIN && sh.length >= MIN) {
    const a = expR(lo), b = expR(sh);
    add(Math.abs(a - b) > .3, "p", "Un lato rende più dell'altro",
      `Long <b>${fmtR(a)}</b> su ${lo.length} trade. Short <b>${fmtR(b)}</b> su ${sh.length}.`,
      `Quando ci sono entrambi, prendi ${a > b ? "il long" : "lo short"}.`);
  }

  /* sweep, when optional — settles the ambiguity in the sheet */
  if (!S.cfg.sweepMandatory) {
    const w = list.filter(t => t.setup == 2 && t.gates?.g2), wo = list.filter(t => t.setup == 2 && !t.gates?.g2);
    if (w.length >= 4 && wo.length >= 4) {
      const a = expR(w), b = expR(wo);
      add(true, Math.abs(a - b) > .25 ? "a" : "p", "Setup 2 con e senza sweep",
        `Con sweep: <b>${fmtR(a)}</b> su ${w.length} trade. Senza sweep: <b>${fmtR(b)}</b> su ${wo.length}.`,
        Math.abs(a - b) > .25 ? `I dati stanno rispondendo alla domanda che il foglio lascia aperta. ${a > b ? "Rendi lo sweep obbligatorio." : "Lo sweep non ti sta aggiungendo nulla."}` : `Ancora nessuna differenza chiara.`);
    }
  }

  /* trade after a loss */
  const after = [];
  const byDay = group(list, t => t.date);
  Object.values(byDay).forEach(day => {
    const s = day.sort((a, b) => (a.time || "").localeCompare(b.time || ""));
    for (let i = 1; i < s.length; i++) if (lost(s[i - 1])) after.push(s[i]);
  });
  if (after.length >= 4) {
    const rest = list.filter(t => !after.includes(t));
    const a = expR(after), b = expR(rest);
    add(a < b - .25, "n", "Il trade subito dopo una perdita",
      `Media <b>${fmtR(a)}</b> su ${after.length} trade, contro <b>${fmtR(b)}</b> sugli altri.`,
      `Dopo uno stop: nessun ordine per venti minuti.`);
  }

  /* trades beyond the cap */
  const beyond = [];
  Object.values(byDay).forEach(day => {
    const s = day.sort((a, b) => (a.time || "").localeCompare(b.time || ""));
    s.slice(S.cfg.maxTrades).forEach(t => beyond.push(t));
  });
  if (beyond.length >= 3) add(true, "n", "Oltre il limite giornaliero",
    `${beyond.length} trade presi dopo aver raggiunto i ${S.cfg.maxTrades} previsti. Media <b>${fmtR(expR(beyond))}</b>.`,
    `Dopo il ${S.cfg.maxTrades}° riempimento, chiudi la piattaforma.`);

  return out;
}


/* ============ OGGI ============ */
function viewOggi() {
  const d = today(), list = bySession(d);
  const cl = closed(list);
  const dayR = cl.reduce((a, t) => a + realisedR(t), 0);
  const capHit = list.length >= S.cfg.maxTrades, lossHit = dayR <= -Math.abs(S.cfg.dailyLossR);
  const cd = cooldown(), eff = efficiency(cl);
  const plannedAvg = cl.length ? avg(cl.map(plannedRR).filter(x => x > 0)) : 0;

  let h = `<div class="kpis">
    ${kpi("Oggi", cl.length ? fmtM(sumMoney(cl)) : "—",
      cl.length ? `${fmtR(dayR)} · ${cl.length} trade` : "Nessun trade oggi",
      dayR > 0 ? "p" : dayR < 0 ? "n" : "mut")}
    ${kpi("Trade", `${list.length}<span class="mut" style="font-size:19px"> / ${S.cfg.maxTrades}</span>`, capHit ? "Limite raggiunto" : "Sotto il limite", capHit ? "n" : "")}
    ${kpi("R:R medio", plannedAvg ? "1:" + plannedAvg.toFixed(1) : "—", `Minimo previsto 1:${S.cfg.minRR1}`, plannedAvg && plannedAvg < n(S.cfg.minRR1) ? "n" : "")}
    ${kpi("Efficienza", eff == null ? "—" : fmtPct(eff), "R preso su R pianificato", eff == null ? "mut" : eff < 70 ? "n" : "p", eff)}
  </div>`;

  const alerts = [];
  if (cd) alerts.push(`Ultimo stop meno di ${S.cfg.cooldownMin} minuti fa. Mancano <b>${cd}m</b>.`);
  if (capHit) alerts.push(`Hai raggiunto i ${S.cfg.maxTrades} trade previsti. Chiudi la piattaforma.`);
  if (lossHit) alerts.push(`Limite di perdita giornaliero raggiunto. La sessione è finita.`);
  if (alerts.length) h += `<div class="banner">${alerts.join("<br>")}</div>`;
  else h += `<div class="card"><div class="cb"><div class="empty">${cl.length ? "Sessione in corso. Trova ogni trade nel Calendario." : "Nessun trade registrato oggi.<br>Una giornata senza setup è una giornata eseguita bene."}</div></div></div>`;

  return h;
}

/* ============ CALENDARIO ============ */
function viewCalendario() {
  const base = new Date((S.cal || today().slice(0, 7)) + "-01T12:00:00");
  const y = base.getFullYear(), m = base.getMonth();
  const key = `${y}-${String(m + 1).padStart(2, "0")}`;
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7; /* settimana da lunedì */

  const byDay = {};
  closed(live()).forEach(t => { (byDay[t.date] = byDay[t.date] || []).push(t); });
  const monthTrades = closed(live()).filter(t => (t.date || "").startsWith(key));
  const monthR = monthTrades.reduce((a, t) => a + realisedR(t), 0);

  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<div class="cell pad"></div>`;
  for (let d = 1; d <= days; d++) {
    const ds = `${key}-${String(d).padStart(2, "0")}`;
    const list = byDay[ds] || [];
    const r = list.reduce((a, t) => a + realisedR(t), 0);
    const viol = list.filter(t => !clean(t)).length;
    const cls = !list.length ? "none" : r > 0.05 ? "win" : r < -0.05 ? "loss" : "";
    const tilt = list.length > n(S.cfg.maxTrades) ? " tilt" : "";
    cells += `<button class="cell ${cls}${tilt}" data-cal="${ds}" ${list.length ? "" : "disabled"}>
      <span class="cellhd"><span class="dn">${d}</span>${list.length ? `<span class="dct">${list.length}×</span>` : ""}</span>
      ${list.length ? `<span class="dr ${r > 0 ? "p" : r < 0 ? "n" : "mut"}">${fmtR(r)}</span>
        ${viol ? `<span class="dv">${viol} viol.</span>` : ""}` : ""}
    </button>`;
  }

  const label = first.toLocaleDateString("it-IT", { month: "long", year: "numeric" });
  let h = `<div class="kpis">

    ${kpi("Trade", monthTrades.length, `Media ${monthTrades.length ? (monthTrades.length / Math.max(1, Object.keys(byDay).filter(d => d.startsWith(key)).length)).toFixed(1) : 0} al giorno`)}
    ${kpi("Esecuzione pulita", monthTrades.length ? fmtPct(monthTrades.filter(clean).length / monthTrades.length * 100) : "—", "Nel mese", "", monthTrades.length ? monthTrades.filter(clean).length / monthTrades.length * 100 : null)}
  </div>`;

  h += `<div class="card"><div class="ch" style="padding:16px 20px 0">
      <h3>${esc(label.charAt(0).toUpperCase() + label.slice(1))}</h3>

        <button data-mon="1" aria-label="Mese successivo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div></div>
    <div class="cb" style="padding:14px 20px 20px">
      <div class="calhd">${["lun", "mar", "mer", "gio", "ven", "sab", "dom"].map(d => `<span>${d}</span>`).join("")}</div>
      <div class="cal">${cells}</div>
    </div></div>`;

  h += `<div class="tiny mut" style="text-align:center;padding:4px 0 12px">Tocca un giorno con trade per aprire la revisione completa.</div>`;
  return h;
}

/* ============ REVISIONE GIORNALIERA (pagina intera) ============ */
function viewDayLog(date) {
  const list = live().filter(t => t.date === date && t.closed).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
  const r = list.reduce((a, t) => a + realisedR(t), 0);
  const dt = S.days[date];

  let h = `<button class="btn ghost sm" data-daylog-back style="margin-bottom:22px">← Calendario</button>`;

  h += `<div class="spread" style="margin-bottom:30px;flex-wrap:wrap;gap:12px;align-items:flex-start">
    <div>
      <h2 style="font-size:23px;font-weight:700;margin:0;letter-spacing:-.02em;text-transform:capitalize">${esc(dLabel(date))}</h2>
      <div class="tiny mut" style="margin-top:5px">${list.length} trade${dt ? ` · giornata ${DAY_TYPES[dt].toLowerCase()}` : ""}</div>
    </div>
    <div class="num ${r > 0 ? "p" : r < 0 ? "n" : "mut"}" style="font-size:28px;font-weight:700">${list.length ? fmtR(r) : "—"}</div>
  </div>`;

  if (!list.length) return h + `<div class="card"><div class="cb"><div class="empty">Nessun trade in questa giornata.</div></div></div>`;

  h += list.map(dayLogCard).join("");
  return h;
}

function dlBox(title, rows) {
  return `<div class="dlbox"><div class="dlbox-t">${esc(title)}</div>
    ${rows.map(([k, v, tone]) => `<div class="dlbox-row"><span>${esc(k)}</span><b class="num ${tone || ""}">${v}</b></div>`).join("")}
  </div>`;
}
const QTAG = { edge: "ok", good: "info", bill: "", dirty: "warn" };
function dayLogCard(t) {
  const q = quadrant(t), v = violations(t), rr = plannedRR(t), r = realisedR(t);
  const ks = shotKeys(t), open = !!S.dlOpen[t.id];
  const pnl = pnlMoney(t), risk = riskMoney(t);

  let h = `<div class="card dlcard" style="margin-bottom:16px">
    <button class="dlhd" data-dltoggle="${t.id}">
      <span class="dirtag ${t.dir}">${t.dir === "long" ? "↗" : "↘"}</span>
      <span class="dlhd-name">${esc(SETUPS[t.setup].name)}</span>
      <span class="tiny mut">${esc(t.time || "")}</span>
      <span class="grow"></span>
      <span class="num ${r == null ? "mut" : r > 0 ? "p" : r < 0 ? "n" : "mut"}" style="font-weight:700">${r == null ? "—" : fmtR(r)}</span>
      <svg class="dlchev ${open ? "on" : ""}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>

          ["Entrata", esc(t.entry)],
          ["Stop", esc(t.stop)],
          ["Uscita", esc(t.exitPrice || t.target || "—")]
        ])}
        ${dlBox("R:R", [
          ["Rischio", riskPts(t) ? riskPts(t).toFixed(2) : "—"],
          ["Pianificato", rr ? "1:" + rr.toFixed(1) : "—"],
          ["Realizzato", r == null ? "—" : fmtR(r), r == null ? "" : r > 0 ? "ok" : r < 0 ? "bad" : ""]
        ])}
        ${dlBox("Risultato", [
          ["P&L", pnl == null ? "—" : fmtM(pnl), pnl == null ? "" : pnl > 0 ? "ok" : pnl < 0 ? "bad" : ""],
          ["Contratti", esc(t.size || "1")],
          ["Rischio ($)", risk ? "$" + risk.toFixed(2) : "—"]

      </div>

      <div class="row" style="gap:10px;flex-wrap:wrap;margin-top:22px">
        ${gradeBadge(t)}
        ${t.manualReason ? `<span class="tiny mut">${esc(t.manualReason)}</span>` : ""}
      </div>
      ${q ? `<div class="flag ${QTAG[q]}" style="margin-top:14px"><span><b>${esc(QUAD[q].t)}.</b> ${esc(QUAD[q].d)}</span></div>` : ""}
      ${v.map(x => `<div class="flag" style="margin-top:8px"><span>${esc(x)}</span></div>`).join("")}
      ${ks.length ? `<div class="dlshots" style="margin-top:26px">${ks.map((k, i) => {
          const src = shotURL(k);
          if (src) return `<div class="dlshot" data-viewshot="${esc(k)}"><img src="${src}" alt="Screenshot ${i + 1}"></div>`;
          return `<div class="dlshot ph">${shotMissing(k) ? "Immagine non trovata" : '<span class="spin"></span>'}</div>`;
        }).join("")}</div>` : `<div class="tiny mut" style="margin-top:14px">Nessuno screenshot caricato.</div>`}
      <div class="lbl" style="margin-top:22px">Note e ragionamento</div>
      <div class="tiny mut" style="margin:4px 0 8px">Cosa stavi pensando, cosa hai notato, cosa cambieresti. Il coach le legge insieme ai trade.</div>

  }
  h += `</div>`;
  return h;
}

/* ============ AI COACH ============ */
function viewCoach() {
  const L = closed(live());
  if (L.length < 3) return `<div class="card"><div class="cb"><div class="empty">Servono più trade live.<br>I confronti iniziano a dire qualcosa dopo una ventina di sessioni.</div></div></div>`;

  const q = { edge: [], good: [], bill: [], dirty: [] };
  L.forEach(t => { const k = quadrant(t); if (k) q[k].push(t); });
  const tot = L.reduce((a, t) => a + realisedR(t), 0);
  const eff = efficiency(L);

  let h = `<div class="kpis">
    ${kpi("Totale", fmtR(tot), `${L.length} trade chiusi`, tot > 0 ? "p" : "n")}
    ${kpi("R medio", fmtR(expR(L)), "Per trade", expR(L) > 0 ? "p" : "n")}
    ${kpi("Sequenza completa", fmtPct(L.filter(t => grade(t) === "A").length / L.length * 100), "Grado A", "", L.filter(t => grade(t) === "A").length / L.length * 100)}
    ${kpi("Efficienza", eff == null ? "—" : fmtPct(eff), "R preso su R pianificato", eff == null ? "mut" : eff < 70 ? "n" : "p", eff)}
  </div>`;

  /* written feedback, refreshed on its own once enough new trades land */
  const c = S.coach;
  const stale = !c || L.length - c.n >= 3;
  let body = "";
  if (busy.coach) body = `<div class="row"><span class="spin"></span> <span class="mut">Sto leggendo le ultime sessioni</span></div>`;
  else if (c) body = `<div class="pre">${esc(c.text)}</div>
    <div class="tiny mut" style="margin-top:12px">Su ${c.n} trade${c.n !== L.length ? `, ora ne hai ${L.length}` : ""}. ${stale ? "Si aggiorna da solo." : "Aggiornato."}</div>
    <button class="btn ghost" data-coach style="margin-top:12px">Rileggi adesso</button>`;
  else if (!S.cfg.apiKey) body = `<div class="mut">Aggiungi la chiave Claude in Impostazioni per ricevere la lettura scritta. Tutto il resto di questa pagina funziona senza.</div>`;
  else body = `<button class="btn" data-coach>Genera la prima lettura</button>`;
  h += card("Il coach", body, c ? new Date(c.at).toLocaleDateString("it-IT", { timeZone: TZ, day: "numeric", month: "long" }) : null);

  h += card("Esecuzione contro esito",
    `<div class="quad">${["edge", "dirty", "good", "bill"].map(k =>
      `<div class="q ${QUAD[k].cls}"><div class="qn num">${q[k].length}</div><div class="qt">${QUAD[k].t}</div><div class="qd">${QUAD[k].d}</div></div>`).join("")}</div>
    ${q.dirty.length ? `<div class="flag warn" style="margin-top:12px">Le vincite sporche valgono <b>${fmtR(q.dirty.reduce((a, t) => a + realisedR(t), 0))}</b> sul conto. È denaro che la strategia non ti ha dato.</div>` : ""}`,
    "Il quadrante che conta è in alto a destra");

  h += card("Cosa dicono i dati", insightList(patterns(L)));

  h += card("Per setup",
    `<div class="lbl" style="padding:6px 24px 0">Per setup</div>` +
    [1, 2].map(sn => {
      const A = L.filter(t => t.setup == sn);
      if (!A.length) return `<div class="st"><span class="sk">${SETUPS[sn].name}</span><span class="sv thin">nessun trade</span></div>`;
      return `<div class="st"><span class="sk">${SETUPS[sn].name} <span class="tiny mut">· ${A.length} trade · ${fmtPct(winRate(A))} vinti</span></span>
        <span class="sv num ${expR(A) > 0 ? "p" : "n"}">${fmtR(expR(A))}</span></div>`;
    }).join("") +
    `<div class="lbl" style="padding:20px 24px 0">Per direzione</div>` +
    ["long", "short"].map(d => {
      const A = L.filter(t => t.dir === d);
      return A.length ? `<div class="st"><span class="sk">${d === "long" ? "Long" : "Short"} <span class="tiny mut">· ${A.length} trade</span></span>
        <span class="sv num ${expR(A) > 0 ? "p" : "n"}">${fmtR(expR(A))}</span></div>` : "";
    }).join(""), null, true);

  const inDay = L.filter(t => t.dayType && !offDay(t)), outDay = L.filter(offDay);
  if (inDay.length && outDay.length) h += card("Setup contro tipo di giornata",
    `<div class="st"><span class="sk">Nella giornata indicata <span class="tiny mut">· ${inDay.length} trade</span></span>
       <span class="sv num ${expR(inDay) > 0 ? "p" : "n"}">${fmtR(expR(inDay))}</span></div>
     <div class="st"><span class="sk">Fuori dalla giornata indicata <span class="tiny mut">· ${outDay.length} trade</span></span>
       <span class="sv num ${expR(outDay) > 0 ? "p" : "n"}">${fmtR(expR(outDay))}</span></div>
     <div class="tiny mut" style="padding:11px 15px 0">Il setup fuori giornata conta come violazione. Questi due numeri ti dicono se la regola sta reggendo o se ti sta costando.</div>`,
    null, true);

  return h;
}
